# Sitio local de la base: lee las notas de la raíz del repo, no las copia.
# Local: ./sitio/servir. Publicado: GitHub Pages, con .github/workflows/sitio.yml en cada
# cambio a main. Lo generado no se versiona.
site_name: Conocimiento
docs_dir: ..
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
use_directory_urls: true
edit_uri: https://github.com/mtsdlf/conocimiento/edit/main/

exclude_docs: |
  /sitio/*
  !/sitio/estilo/
  /Archivo/

extra_css:
  - sitio/estilo/base.css

hooks:
  - nav.py

theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    edit: material/pencil-outline
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.prune
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Modo oscuro}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Modo claro}

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  # Ids de los títulos como los de GitHub (con tildes y eñes), para que `nota.md#ancla` ande en los
  # dos lados; los repetidos llevan `-1`, `-2` por nav.py. Se controla con `python3 sitio/anclas.py`.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: ignore
