# Publica la base como sitio en GitHub Pages en cada cambio a main.
# El sitio se genera con sitio/mkdocs.yml; lo generado no se versiona.
name: Sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Armar el sitio
        working-directory: sitio
        env:
          SITE_URL: https://mtsdlf.github.io/conocimiento/
          NO_MKDOCS_2_WARNING: "1"
        run: uvx --with-requirements requirements.txt mkdocs build --site-dir "$RUNNER_TEMP/sitio"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
